[package]
name = "mole-fixtures"
version = "0.0.0"
edition = "2024"
publish = false
# Regenerates ../fixtures.json: cargo run --release --manifest-path generator/Cargo.toml > fixtures.json
# Standalone; not part of the workerd build.
[workspace]

[[bin]]
name = "mole-fixtures"
path = "main.rs"

[dependencies]
act = { package = "act-rs", git = "https://github.com/Moderation-of-unLinkable-Endorsements/act-rs", rev = "f1bd64b90408677662bb9f96915d8dc0e58e1ad6" }
ec-ihat = { package = "ihat-rs", git = "https://github.com/Moderation-of-unLinkable-Endorsements/ihat-rs", rev = "ed756147ac9a1cc530d718e749c0fae8090fda7c" }
hex = "0.4"
sha2 = "0.10"
